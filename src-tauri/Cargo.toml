[package]
name = "luminadesk"
version = "0.1.0"
description = "LuminaDesk — Windows 桌面美化与效率工具"
edition = "2021"

[lib]
name = "luminadesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
log = "0.4"
sysinfo = "0.33"
notify = "8"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
